services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    command: sh -c "npm ci && npx prisma generate && npx prisma migrate deploy && npx tsx prisma/seed.ts && npx tsx watch src/index.ts"
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${BACKEND_PORT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CSRF_SECRET: ${CSRF_SECRET}
      COOKIE_ENCRYPTION_KEY: ${COOKIE_ENCRYPTION_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      GOOGLE_OAUTH_SUCCESS_REDIRECT: ${GOOGLE_OAUTH_SUCCESS_REDIRECT}
      GOOGLE_OAUTH_FAILURE_REDIRECT: ${GOOGLE_OAUTH_FAILURE_REDIRECT}
      OAUTH_STATE_TTL_SECONDS: ${OAUTH_STATE_TTL_SECONDS}
      OAUTH_PKCE_TTL_SECONDS: ${OAUTH_PKCE_TTL_SECONDS}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      TRUST_PROXY: ${TRUST_PROXY}
      AUDIT_ADMIN_DATABASE_URL: ${AUDIT_ADMIN_DATABASE_URL}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /app
    depends_on:
      - backend
    environment:
      NODE_ENV: ${NODE_ENV}
      VITE_API_URL: ${VITE_API_URL_DOCKER}
      VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  mysql_data:
  backend_node_modules:
  frontend_node_modules:
