x-backend-env: &backend-env
  NODE_ENV: ${NODE_ENV}
  PORT: ${BACKEND_PORT}
  DATABASE_URL: ${DATABASE_URL}
  JWT_SECRET: ${JWT_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  CSRF_SECRET: ${CSRF_SECRET}
  COOKIE_ENCRYPTION_KEY: ${COOKIE_ENCRYPTION_KEY}
  CORS_ORIGIN: ${CORS_ORIGIN}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
  GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
  GOOGLE_OAUTH_SUCCESS_REDIRECT: ${GOOGLE_OAUTH_SUCCESS_REDIRECT}
  GOOGLE_OAUTH_FAILURE_REDIRECT: ${GOOGLE_OAUTH_FAILURE_REDIRECT}
  OAUTH_STATE_TTL_SECONDS: ${OAUTH_STATE_TTL_SECONDS:-300}
  OAUTH_PKCE_TTL_SECONDS: ${OAUTH_PKCE_TTL_SECONDS:-300}
  TURNSTILE_SECRET: ${TURNSTILE_SECRET}
  RESEND_API_KEY: ${RESEND_API_KEY}
  EMAIL_FROM: ${EMAIL_FROM}
  TRUST_PROXY: ${TRUST_PROXY}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    command: sh -c "npm ci && npx prisma generate && if [ \"$${RUN_MIGRATIONS:-1}\" = 1 ]; then npx prisma migrate deploy; fi && npx tsx prisma/seed.ts && npx tsx watch src/index.ts"
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  # Scheduled audit_logs retention pruning (docs/SPEC.md §3). Opt-in: only starts with
  # `docker compose --profile ops up -d --build audit-pruner`, since it needs AUDIT_ADMIN_DATABASE_URL
  # (a privileged MySQL user, not the app's) to be set.
  audit-pruner:
    profiles: ["ops"]
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *backend-env
      # Privileged connection lives only in this service, never in `backend`. DATABASE_URL is
      # overridden with it so `docker compose --profile ops run --rm --build audit-pruner npx prisma
      # migrate deploy` migrates as the privileged user once the grants script is applied.
      DATABASE_URL: ${AUDIT_ADMIN_DATABASE_URL}
      AUDIT_ADMIN_DATABASE_URL: ${AUDIT_ADMIN_DATABASE_URL}
      AUDIT_PRUNE_SCHEDULE: ${AUDIT_PRUNE_SCHEDULE:-0 3 * * *}
    command:
      - sh
      - -c
      - |
        if [ -z "$$AUDIT_ADMIN_DATABASE_URL" ]; then
          echo "AUDIT_ADMIN_DATABASE_URL is not set; refusing to start audit-pruner" >&2
          exit 1
        fi
        npx prisma generate
        umask 077
        export -p > /app/.cron-env
        echo "$$AUDIT_PRUNE_SCHEDULE . /app/.cron-env; cd /app && npx tsx scripts/prune-audit-logs.ts >/proc/1/fd/1 2>/proc/1/fd/2" > /etc/crontabs/root
        exec crond -f -l 8

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /app
    depends_on:
      - backend
    environment:
      NODE_ENV: ${NODE_ENV}
      VITE_API_URL: ${VITE_API_URL_DOCKER}
      VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  mysql_data:
  backend_node_modules:
  frontend_node_modules:
